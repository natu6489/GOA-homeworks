<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
INLINE ელემენტები:
- იკავებს მხოლოდ იმ ადგილს, რაც ტექსტს სჭირდება
- ახალ ხაზზე არ გადადის
- width და height ჩვეულებრივ არ მუშაობს

BLOCK LEVEL ელემენტები:
- იკავებს მთელ ხაზს (სიგანეს)
- ყოველთვის ახალ ხაზზე იწყება
- width და height მუშაობს
-->

<!-- 
CSS (Cascading Style Sheets) გამოიყენება საიტის დიზაინისთვის.
მისი დახმარებით ვცვლით ტექსტის ფერს, ფონს, ზომას, განლაგებას და ა.შ.

CSS-ის დაწერის ერთ-ერთი ტექნიკაა INLINE CSS.
INLINE ნიშნავს, რომ სტილებს ვწერთ პირდაპირ HTML თეგში style ატრიბუტის გამოყენებით.
-->



<!-- color ცვლის ტექსტის ფერს -->
<p style="color: blue;">vbhtub</p>
<p style="color: green;">vhbbfty</p>

<!-- background-color ცვლის ელემენტის ფონს -->
<p style="background-color: yellow;">vbvcvtyb</p>


<!-- text-align აკონტროლებს ტექსტის განლაგებას -->
<p style="text-align: left;">rdcvbnjty</p>
<p style="text-align: center;">rdcvbnjty</p>
<p style="text-align: right;">rdcvbnjty</p>


</body>
</html>
