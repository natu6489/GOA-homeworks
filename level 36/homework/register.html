<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1> MovieLogo</h1>
        <nav>
             <a href="index.html">Home</a> 
             <a href="favorites.html">Favorites</a> 
             <a href="register.html">Register</a>
        </nav>
    </header>

    <main>
        <h2>რეგისტრაცია</h2>
        <form>
            <div>
                <label>სრული სახელი:</label>
                <input type="text" required>
            </div>
            <div>
                <label>ემაილი:</label>
                <input type="email" required>
            </div>
            <div>
                <label>პაროლი:</label>
                <input type="password" required>
            </div>
            <div>
                <label>სქესი:</label>
                <input type="radio" name="gender" value="male"> კაცი
                <input type="radio" name="gender" value="female"> ქალი
            </div>
            <div>
                <label>ქვეყანა:</label>
                <select>
                    <option value="ge">საქართველო</option>
                    <option value="us">აშშ</option>
                    <option value="uk">დიდი ბრიტანეთი</option>
                </select>
            </div>
            <div>
                <input type="checkbox" required> ვეთანხმები წესებს
            </div>
            <button type="submit">რეგისტრაცია</button>
        </form>
    </main>

    <footer>
        <nav>
            <a href="index.html">Home</a> 
            <a href="favorites.html">Favorites</a> 
            <a href="register.html">Register</a>
        </nav>
    </footer>
