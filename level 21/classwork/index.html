<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

     <form>
        <label for="name">სახელი:</label><br>
        <input type="text" id="name" name="name" placeholder="შეიყვანეთ სახელი" required>
        <br><br>
        <label for="surname">გვარი:</label><br>
        <input type="text" id="surname" name="surname" placeholder="შეიყვანეთ გვარი">
        <br><br>
        <label for="email">ემაილი:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        <br><br>
        <label for="password">პაროლი:</label><br>
        <input type="password" id="password" name="password" placeholder="შეიყვანეთ პაროლი" required>
        <br><br>
        <label>გენდერი:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">მამრობითი</label><br>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">მდედრობითი</label>
        <br><br>

        <button type="submit">გაგზავნა</button>
    </form>




    
</body>
</html>
