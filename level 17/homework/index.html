მაგალითად:

აქ "src" და "alt" — ორივე არის ატრიბუტი.

<!--

მაგალითად <img>–ში "src" აუცილებელია.

Optional ატრიბუტი:
ეს არის ატრიბუტი, რომელიც დამატებითი ფუნქციისთვის გამოიყენება,

მაგალითად <img>–ში "alt" არჩევითია.
<img src="photo.jpg" alt="description">
-->
