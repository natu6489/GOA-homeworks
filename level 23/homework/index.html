<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

    
        <label>სახელი:</label><br>
        <input type="text" name="first_name" placeholder="შეიყვანეთ სახელი" required>
        <br><br>

        
        <label>გვარი:</label><br>
        <input type="text" name="last_name" placeholder="შეიყვანეთ გვარი" required>
        <br><br>

       
        <label>ასაკი:</label><br>
        <input type="number" name="age" placeholder="შეიყვანეთ ასაკი" required>
        <br><br>

       
        <label>გენდერი:</label><br>

        <input type="radio" name="gender" value="male" required>
        მამაკაცი

        <input type="radio" name="gender" value="female">
        ქალი

        <input type="radio" name="gender" value="other">
        სხვა
        <br><br>

       
        <label>ქვეყანა:</label><br>
        <select name="country" required>
            <option value="">აირჩიეთ ქვეყანა</option>
            <option value="georgia">საქართველო</option>
            <option value="usa">აშშ</option>
            <option value="uk">ინგლისი</option>
            <option value="germany">გერმანია</option>
            <option value="france">საფრანგეთი</option>
            <option value="italy">იტალია</option>
            <option value="spain">ესპანეთი</option>
            <option value="turkey">თურქეთი</option>
            <option value="japan">იაპონია</option>
            <option value="canada">კანადა</option>
        </select>
        <br><br>

        <input type="checkbox" name="agree" required>
        ვეთანხმები საიტის გამოყენების პოლიტიკას და წესებს
        <br><br>

       
        <input type="submit" value="რეგისტრაცია">

    </form>


</body>
</html>
