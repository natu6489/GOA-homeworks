<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- დალაგებული სია (ordered list - <ol>):
- ელემენტები ავტომატურად მიიღებენ ნომრებს: 1, 2, 3...
- გამოიყენება მაშინ, როცა ელემენტების თანმიმდევრობა მნიშვნელოვანია.
  მაგ: ტოპ რეიტინგები, ნაბიჯობრივი ინსტრუქცია, გაკვეთილების თანმიმდევრობა.

დაულაგებელი სია (unordered list - <ul>):
- ელემენტები მონიშნულია წერტილებით ან სხვა ნიშნებით.
- გამოიყენება მაშინ, როცა ელემენტების რიგს მნიშვნელობა არ აქვს.
  მაგ: პროდუქტების სია, თვისებები, შემთხვევითი ჩამონათვალი. -->




<ol>
    <li>Interstellar</li>
    <li>The Shawshank Redemption</li>
    <li>Inception</li>
    <li>Harry Potter</li>
    <li>Dead Poets Society</li>
</ol>






<ul>
    <li>
        <!-- 3 ელემენტიანი დალაგებული სია -->
        <ol>
            <li>Interstellar</li>
            <li>Inception</li>
            <li>Harry Potter</li>
        </ol>
    </li>

    <li>
        <!-- 3 ელემენტიანი დაულაგებელი სია -->
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Orange</li>
        </ul>
    </li>

    <!-- დამატებით 4 ჩვეულებრივი ელემენტი -->
    <li>Football</li>
    <li>Music</li>
    <li>Programming</li>
    <li>Art</li>
</ul>












</body>
</html>
