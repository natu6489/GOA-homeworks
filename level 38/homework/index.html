<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--
INLINE CSS:
იწერება პირდაპირ HTML თეგში style ატრიბუტის გამოყენებით.
მაგალითი: <p style="color:red;">Text</p>
გამოიყენება პატარა, ერთჯერადი ცვლილებებისთვის.
მინუსი: კოდი არაორგანიზებულია და დიდი საიტისთვის არ არის მოსახერხებელი.
-->

<!--
INTERNAL CSS:
იწერება <style> თეგში, რომელიც თავსდება <head> სექციაში.
გამოიყენება მაშინ, როცა ერთი HTML ფაილის შიგნით გვინდა სტილების დაწერა.
უპირატესობა: კოდი უფრო დალაგებულია ვიდრე inline.
-->

<!--
EXTERNAL CSS:
იწერება ცალკე .css ფაილში და უკავშირდება HTML-ს <link> თეგით.
მაგალითი: <link rel="stylesheet" href="style.css">
ყველაზე მოსახერხებელია დიდი პროექტებისთვის,
რადგან ერთი CSS ფაილი შეიძლება ბევრ გვერდზე გამოიყენო.
-->










<!-- SELECTOR (სელექტორი) არის ის ნაწილი CSS-ში,
რომელიც მიუთითებს რომელ HTML ელემენტს უნდა მივცეთ სტილი.

მაგალითად:

p {
   color: blue;
}

აქ "p" არის tag selector. -->


<!-- TAG SELECTOR ირჩევს კონკრეტული ტიპის თეგს.
მაგალითად:

p { color: red; }

ეს ნიშნავს, რომ ყველა <p> თეგი გახდება წითელი. -->











    
</body>
</html>
